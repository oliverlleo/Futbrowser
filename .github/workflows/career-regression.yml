name: Career Hub regression

on:
  push:
    branches:
      - agent/fix-onboarding-negotiation
      - temp-supabase-competition-deploy
  pull_request:
    paths:
      - 'career.html'
      - 'manager.html'
      - 'dashboard.html'
      - 'src/pages/career/**'
      - 'src/pages/manager/**'
      - 'src/pages/dashboard/**'
      - 'src/services/career-service.js'
      - 'src/services/offer-service.js'
      - 'src/services/manager-service.js'
      - 'supabase/migrations/**'
      - 'docs/ACADEMY_SQUAD_ARCHITECTURE.md'
      - 'tests/**'
      - '.github/workflows/career-regression.yml'

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check src/pages/dashboard/offers-ui.js
          node --check src/services/offer-service.js
          node --check src/pages/career/career-v3.js
          node --check src/pages/career/career-loader-v3.js
          node --check src/pages/career/career-competition-center.js
          node --check src/pages/career/career-profile-v2.js
          node --check src/pages/career/career-profile-history-v2.js
          node --check src/pages/career/career-team-pitch-v2.js
          node --check src/pages/career/career-meta-service.js
          node --check src/pages/career/career-development-loop.js
          node --check src/pages/career/career-level-summary-v8.js
          node --check src/pages/career/career-ui-usability-v6.js
          node --check src/pages/career/career-club-path-v8.js
          node --check src/pages/career/career-commercial-market-v12.js
          node --check src/pages/career/career-commercial-polish-v13.js
          node --check src/pages/career/career-market-inbox-v14.js
          node --check src/pages/career/career-sponsor-negotiation-v15.js
          node --check src/pages/career/career-preparation-ui-v7.js
          node --check src/pages/career/career-preparation-team-guard-v7.js
          node --check src/pages/career/career-match-engine-v2.js
          node --check src/pages/career/career-match-engine-v3.js
          node --check src/pages/career/career-match-formation-patch.js
          node --check src/pages/career/career-match-goalkeeper-patch.js
          node --check src/pages/career/career-match-football-flow-patch.js
          node --check src/pages/career/career-match-football-intelligence-patch.js
          node --check src/pages/career/career-match-flow-ui-patch.js
          node --check src/pages/career/career-match-balance-v3.js
          node --check src/pages/career/career-match-action-balance-v4.js
          node --check src/pages/career/career-match-career-context-v6.js
          node --check src/pages/career/career-match-possession-chain-v5.js
          node --check src/pages/career/career-match-consequence-coherence-v7.js
          node --check src/pages/career/career-match-decision-option-guard.js
          node --check src/pages/career/career-match-gameplay-depth-v2.js
          node --check src/pages/career/career-match-gameplay-depth-ui.js
          node --check src/pages/career/career-match-runtime-v3.js
          node --check src/pages/career/career-match-feedback-hold.js
          node --check src/services/career-service.js
          node --check src/pages/manager/manager.js
          node --check src/pages/dashboard/manager-path.js
          node --check src/services/manager-service.js

      - name: Regression tests
        run: node --test tests/offer-validation.test.mjs tests/career-architecture.test.mjs tests/academy-category-domain.test.mjs tests/career-match-engine.test.mjs tests/career-match-progression.test.mjs tests/career-match-formation.test.mjs tests/career-match-goalkeeper.test.mjs tests/career-match-feedback.test.mjs tests/career-match-football-flow.test.mjs tests/competition-squad-architecture.test.mjs tests/career-match-gameplay-depth.test.mjs tests/career-match-balance-progression.test.mjs tests/career-match-action-balance-v4.test.mjs tests/ai-player-action-attributes.test.mjs tests/career-match-possession-chain.test.mjs tests/career-match-consequence-coherence-v7.test.mjs tests/career-preparation-gameplay.test.mjs tests/career-commercial-market.test.mjs tests/manager-mode-foundation.test.mjs
