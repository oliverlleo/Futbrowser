name: Supabase production migrations

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-onboarding-negotiation
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production-migrations.yml'

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aqbikkjvosxvlysbzpvr
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Verify deployment token
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN secret is missing'; exit 2; }
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"

      - name: Apply pending migrations through Supabase Management API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          project_ref = os.environ['PROJECT_REF']
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          endpoint = f'https://api.supabase.com/v1/projects/{project_ref}/database/query'

          def execute(sql, read_only=False):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'query': sql, 'read_only': read_only}).encode('utf-8'),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      raw = response.read().decode('utf-8')
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'Supabase Management API HTTP {exc.code}: {body}') from exc

          execute('''
            create schema if not exists supabase_migrations;
            create table if not exists supabase_migrations.schema_migrations (
              version text primary key,
              statements text[],
              name text
            );
          ''')

          rows = execute(
              'select version from supabase_migrations.schema_migrations order by version',
              read_only=True,
          ) or []
          applied = {
              str(row['version'])
              for row in rows
              if isinstance(row, dict) and row.get('version') is not None
          }

          migration_files = sorted(pathlib.Path('supabase/migrations').glob('*.sql'))
          pending = []
          for path in migration_files:
              version, _, name_part = path.stem.partition('_')
              if version not in applied:
                  pending.append((version, name_part or path.stem, path))

          print(f'{len(migration_files)} migration files found; {len(pending)} pending.')

          for version, name, path in pending:
              sql = path.read_text(encoding='utf-8')
              print(f'Applying {path.name} ...')
              execute(sql)
              execute(
                  '''
                  insert into supabase_migrations.schema_migrations(version, statements, name)
                  values ($1, array[$2]::text[], $3)
                  on conflict (version) do update set name=excluded.name
                  ''',
              ) if False else None
              safe_version = version.replace("'", "''")
              safe_name = name.replace("'", "''")
              execute(
                  f"insert into supabase_migrations.schema_migrations(version, statements, name) "
                  f"values ('{safe_version}', array[]::text[], '{safe_name}') "
                  f"on conflict (version) do update set name=excluded.name"
              )

          checks = execute('''
            select
              to_regprocedure('public.record_career_match_result(text,text,boolean,boolean,integer,integer,integer,numeric,integer,integer)') is not null as has_legacy_result_rpc,
              to_regprocedure('public.record_career_match_gameplay(text,text,boolean,boolean,integer,integer,integer,numeric,integer,integer,jsonb)') is not null as has_gameplay_rpc,
              to_regprocedure('public.get_career_match_context()') is not null as has_match_context_rpc,
              to_regprocedure('public.reconcile_career_match_progression()') is not null as has_reconcile_rpc
          ''', read_only=True) or []

          if not checks:
              raise RuntimeError('RPC verification returned no rows.')
          row = checks[0]
          missing = [key for key, value in row.items() if not value]
          if missing:
              raise RuntimeError('Required match backend objects are missing: ' + ', '.join(missing))

          print('All required Career Match RPCs verified in production.')
          PY
