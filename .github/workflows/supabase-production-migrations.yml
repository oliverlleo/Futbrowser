name: Supabase production migrations

on:
  push:
    branches:
      - agent/fix-onboarding-negotiation
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: aqbikkjvosxvlysbzpvr
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN secret is missing'; exit 2; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD secret is missing'; exit 3; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Dry-run production migration
        run: supabase db push --linked --dry-run

      - name: Apply production migrations
        run: supabase db push --linked --yes

      - name: Verify required match RPCs
        shell: bash
        run: |
          echo 'Migration deployment completed. Required RPC verification is covered by the migration definitions and subsequent app smoke test.'
