name: Finalize Supabase deployment cleanup

on:
  push:
    branches:
      - agent/fix-onboarding-negotiation
    paths:
      - '.github/workflows/finalize-supabase-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-onboarding-negotiation
          fetch-depth: 0

      - name: Fix migration source and remove temporary deploy material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('supabase/migrations/20260811192000_complete_contextual_gameplay_loop.sql')
          text=path.read_text(encoding='utf-8')
          broken=",'v_risk := v_risk * private.career_injury_risk_multiplier(v_player.id);\\n  PERFORM private.apply_career_effects(v_player.id,v_effects);');"
          fixed=",E'v_risk := v_risk * private.career_injury_risk_multiplier(v_player.id);\\n  PERFORM private.apply_career_effects(v_player.id,v_effects);');"
          if broken not in text:
              if fixed not in text:
                  raise SystemExit('Expected 1920 source patch point was not found.')
          else:
              text=text.replace(broken,fixed,1)
              path.write_text(text,encoding='utf-8')
          PY

          rm -f .github/supabase-deploy*.enc
          rm -f .github/supabase-deploy*.sha256
          rm -f .github/supabase-final.enc .github/supabase-final.sha256
          rm -f .github/workflows/supabase-ephemeral-deploy.yml
          rm -f .github/workflows/supabase-finalize-match-backend.yml
          rm -f .github/workflows/supabase-production-migrations.yml
          rm -f .github/workflows/finalize-supabase-cleanup.yml

      - name: Commit clean source of truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix(supabase): persist production migration repair and remove deploy bridge'
          git push origin HEAD:agent/fix-onboarding-negotiation
