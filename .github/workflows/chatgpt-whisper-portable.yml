name: ChatGPT Whisper portable binary

on:
  push:
    branches:
      - chatgpt-ptbr-model-20260831

jobs:
  build-portable:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1234567890"
    steps:
      - name: Build portable AVX2 whisper.cpp
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CCACHE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_AVX512=OFF \
            -DGGML_AVX512_VBMI=OFF \
            -DGGML_AVX512_VNNI=OFF \
            -DGGML_AVX512_BF16=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j2
          mkdir -p portable
          cp whisper.cpp/build/bin/whisper-cli portable/
          chmod +x portable/whisper-cli
          portable/whisper-cli --version || true
          ldd portable/whisper-cli || true
      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-portable-avx2
          path: portable
          retention-days: 1
          compression-level: 0
