name: Probe GitHub Models Image Support

on:
  push:
    paths:
      - '.github/workflows/list-image-models.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub Models CLI extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install https://github.com/github/gh-models

      - name: List available models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '=== ALL MODELS ==='
          gh models list | tee models.txt
          echo '=== POSSIBLE IMAGE MODELS ==='
          grep -Ei 'image|flux|dall|stable|diffusion|ideogram|imagen|gpt-image|recraft' models.txt || true
