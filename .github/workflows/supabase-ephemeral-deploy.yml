name: Supabase ephemeral production deploy

on:
  push:
    branches:
      - agent/fix-onboarding-negotiation
    paths:
      - '.github/workflows/supabase-ephemeral-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: aqbikkjvosxvlysbzpvr
      BRANCH_NAME: agent/fix-onboarding-negotiation
      PAYLOAD_PATH: .github/supabase-deploy-v4.enc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          chmod 600 "$RUNNER_TEMP/private.pem"

      - name: Publish one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: supabase-one-time-public-key-v4
          path: ${{ runner.temp }}/public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted PAT payload
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 120); do
            git fetch --quiet origin "$BRANCH_NAME"
            if git cat-file -e "origin/$BRANCH_NAME:$PAYLOAD_PATH" 2>/dev/null; then
              git show "origin/$BRANCH_NAME:$PAYLOAD_PATH" > "$RUNNER_TEMP/payload.enc"
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'Encrypted payload did not arrive in time.'; exit 4; }

      - name: Decrypt PAT in runner memory
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/private.pem" \
            -in "$RUNNER_TEMP/payload.enc" \
            -out "$RUNNER_TEMP/payload.env" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          chmod 600 "$RUNNER_TEMP/payload.env"
          set -a
          . "$RUNNER_TEMP/payload.env"
          set +a
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing access token after decrypt.'; exit 5; }
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$SUPABASE_ACCESS_TOKEN" >> "$GITHUB_ENV"
          shred -u "$RUNNER_TEMP/payload.env" || rm -f "$RUNNER_TEMP/payload.env"

      - name: Apply newer migrations with Management API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile

          ref = os.environ['PROJECT_REF']
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          endpoint = f'https://api.supabase.com/v1/projects/{ref}/database/query'

          def sql(query, read_only=False):
              payload = json.dumps({'query': query, 'read_only': read_only})
              with tempfile.NamedTemporaryFile('w+', delete=False) as body:
                  body_path = body.name
              try:
                  proc = subprocess.run([
                      'curl', '--silent', '--show-error', '--location',
                      '--connect-timeout', '30', '--max-time', '180',
                      '--user-agent', 'Mozilla/5.0 Futbrowser-Deploy/1.0',
                      '--header', f'Authorization: Bearer {token}',
                      '--header', 'Content-Type: application/json',
                      '--header', 'Accept: application/json',
                      '--output', body_path,
                      '--write-out', '%{http_code}',
                      '--request', 'POST',
                      '--data-binary', payload,
                      endpoint,
                  ], text=True, capture_output=True)
                  if proc.returncode != 0:
                      raise RuntimeError(f'curl failed: {proc.stderr.strip()}')
                  status = proc.stdout.strip()
                  raw = pathlib.Path(body_path).read_text(encoding='utf-8', errors='replace')
                  if status not in {'200','201'}:
                      raise RuntimeError(f'Management API HTTP {status}: {raw}')
                  parsed = json.loads(raw) if raw else []
                  if isinstance(parsed, dict) and 'result' in parsed:
                      return parsed.get('result') or []
                  return parsed or []
              finally:
                  pathlib.Path(body_path).unlink(missing_ok=True)

          history = sql('select version from supabase_migrations.schema_migrations order by version', read_only=True)
          applied = {str(row['version']) for row in history if isinstance(row, dict) and row.get('version') is not None}
          if not applied:
              raise RuntimeError('Remote migration history is empty; refusing unsafe incremental deploy.')
          remote_latest = max(applied)
          print(f'Remote migration history has {len(applied)} versions.')
          print(f'Latest remote migration: {remote_latest}')

          files = sorted(pathlib.Path('supabase/migrations').glob('*.sql'))
          pending = []
          for path in files:
              version, _, name = path.stem.partition('_')
              if version > remote_latest and version not in applied:
                  pending.append((version, name or path.stem, path))

          print(f'{len(pending)} newer migrations pending.')
          for version, name, path in pending:
              print(f' - {path.name}')

          for version, name, path in pending:
              print(f'Applying {path.name} ...')
              migration_sql = path.read_text(encoding='utf-8')
              try:
                  sql(migration_sql, read_only=False)
              except Exception as exc:
                  raise RuntimeError(f'FAILED MIGRATION {path.name}: {exc}') from exc
              safe_version = version.replace("'", "''")
              safe_name = name.replace("'", "''")
              sql(
                  "insert into supabase_migrations.schema_migrations(version, statements, name) "
                  f"values ('{safe_version}', array[]::text[], '{safe_name}') "
                  "on conflict (version) do update set name=excluded.name",
                  read_only=False,
              )
              print(f'Applied {path.name}.')

          # Force PostgREST to refresh its function/schema cache after DDL.
          sql("NOTIFY pgrst, 'reload schema';", read_only=False)

          checks = sql('''
            select
              to_regprocedure('public.record_career_match_result(text,text,boolean,boolean,integer,integer,integer,numeric,integer,integer)') is not null as record_result,
              to_regprocedure('public.record_career_match_gameplay(text,text,boolean,boolean,integer,integer,integer,numeric,integer,integer,jsonb)') is not null as record_gameplay,
              to_regprocedure('public.get_career_match_context()') is not null as match_context,
              to_regprocedure('public.reconcile_career_match_progression()') is not null as reconcile_progression
          ''', read_only=True)
          if not checks or not isinstance(checks[0], dict):
              raise RuntimeError(f'RPC verification returned unexpected response: {checks!r}')
          row = checks[0]
          print('RPC verification:', row)
          missing = [key for key, value in row.items() if value is not True]
          if missing:
              raise RuntimeError('Missing required RPCs after deploy: ' + ', '.join(missing))

          required_versions = {'20260811193000','20260811193100','20260811193200','20260811193300'}
          final_history = sql('select version from supabase_migrations.schema_migrations order by version', read_only=True)
          final_versions = {str(row['version']) for row in final_history if isinstance(row, dict) and row.get('version')}
          missing_versions = sorted(required_versions - final_versions)
          if missing_versions:
              raise RuntimeError('Required match migration versions missing from history: ' + ', '.join(missing_versions))

          print('Production Career Match backend is deployed and verified.')
          PY

      - name: Destroy one-time key material
        if: always()
        shell: bash
        run: |
          shred -u "$RUNNER_TEMP/private.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/private.pem"
          rm -f "$RUNNER_TEMP/public.pem" "$RUNNER_TEMP/payload.enc"
