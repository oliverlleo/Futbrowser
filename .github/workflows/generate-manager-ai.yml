name: Generate Manager Art Test

on:
  push:
    paths:
      - '.github/workflows/generate-manager-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install image generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch diffusers transformers accelerate safetensors pillow sentencepiece

      - name: Generate one individual football manager portrait
        run: |
          mkdir -p generated-manager-test
          python - <<'PY'
          import torch
          from diffusers import AutoPipelineForText2Image, DEISMultistepScheduler

          torch.set_num_threads(4)
          model_id = "Lykon/dreamshaper-7"

          pipe = AutoPipelineForText2Image.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              use_safetensors=True,
          )
          pipe.scheduler = DEISMultistepScheduler.from_config(pipe.scheduler.config)
          pipe = pipe.to("cpu")
          pipe.enable_attention_slicing()

          prompt = (
              "masterpiece, best quality, RAW photo, photorealistic professional sports photography, "
              "ONE SINGLE fictional professional association football head coach, NOT a player, "
              "standing alone at the sideline of a large football stadium during a night match, "
              "medium close-up portrait from chest to waist, head fully visible with generous space above hair, both shoulders inside frame, "
              "slightly low camera angle, three-quarter face looking to the right of camera, calm serious expression, "
              "42-year-old man, mature face, short textured dark hair, natural trimmed beard, "
              "wearing a plain elegant BLACK COACHING JACKET over a black knit top, no sports jersey, no uniform, "
              "bright stadium floodlights behind the subject, night sky, blurred stadium stands and crowd in background, "
              "strong white rim light, cinematic shallow depth of field, subtle green and golden airborne particles, "
              "high contrast, realistic skin pores, detailed fabric, 85mm lens, film grain, cinematic color grading, "
              "premium football management video game character portrait"
          )
          negative = (
              "text, typography, letters, logo, logos, brand, branding, badge, emblem, crest, watermark, signature, sponsor, "
              "football player, soccer player, jersey, kit, t-shirt, team shirt, shorts, athlete uniform, ball, "
              "multiple people, second person, foreground crowd, collage, grid, contact sheet, panels, split screen, "
              "maintenance technician, mechanic, tools, wrench, drill, hard hat, safety vest, workshop, office, "
              "front-facing passport photo, studio gray background, plain studio backdrop, framed portrait, picture frame, "
              "cartoon, anime, illustration, painting, CGI plastic skin, lowres, blurry face, distorted face, bad anatomy, extra limbs"
          )

          generator = torch.Generator(device="cpu").manual_seed(20260814)
          image = pipe(
              prompt=prompt,
              negative_prompt=negative,
              num_inference_steps=25,
              guidance_scale=7.5,
              width=512,
              height=640,
              generator=generator,
          ).images[0]
          image.save("generated-manager-test/manager-test.png")
          PY

      - name: Upload generated portrait
        uses: actions/upload-artifact@v4
        with:
          name: manager-art-test-full-dreamshaper
          path: generated-manager-test/manager-test.png
          if-no-files-found: error
          retention-days: 1
