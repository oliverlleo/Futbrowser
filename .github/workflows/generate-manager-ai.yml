name: Generate Manager Art Test

on:
  push:
    paths:
      - '.github/workflows/generate-manager-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install image generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch diffusers transformers accelerate safetensors pillow sentencepiece peft

      - name: Generate one individual football manager portrait
        run: |
          mkdir -p generated-manager-test
          python - <<'PY'
          import torch
          from diffusers import AutoPipelineForText2Image, LCMScheduler

          torch.set_num_threads(4)
          model_id = "Lykon/dreamshaper-7"
          adapter_id = "latent-consistency/lcm-lora-sdv1-5"

          pipe = AutoPipelineForText2Image.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              use_safetensors=True,
          )
          pipe.scheduler = LCMScheduler.from_config(pipe.scheduler.config)
          pipe.load_lora_weights(adapter_id)
          pipe.fuse_lora()
          pipe = pipe.to("cpu")
          pipe.enable_attention_slicing()

          prompt = (
              "masterpiece, best quality, RAW professional sports portrait photo, photorealistic, "
              "one single fictional male professional football head coach standing alone on the touchline, "
              "waist-up portrait, head and both shoulders fully inside frame, slightly low camera angle, "
              "three-quarter view looking off camera with calm determined expression, "
              "42 years old, distinct masculine face, short dark textured hair, natural short beard, "
              "plain premium black technical jacket with absolutely no branding, "
              "night football stadium, huge white floodlights behind him, shallow depth of field, "
              "crowd far in soft bokeh, subtle green and golden particles, dramatic rim light around hair and shoulders, "
              "high contrast cinematic color grading, realistic skin pores, realistic fabric texture, 85mm lens, film grain, "
              "premium football career video game character artwork"
          )
          negative = (
              "text, letters, words, logo, brand, badge, emblem, crest, watermark, signature, sponsor, jersey, football kit, "
              "multiple people, two people, group, collage, grid, contact sheet, split screen, panels, duplicate person, "
              "maintenance worker, mechanic, tools, hard hat, safety vest, workshop, office, "
              "cartoon, anime, illustration, painting, lowres, blurry face, deformed face, bad anatomy, extra arms, extra fingers"
          )

          generator = torch.Generator(device="cpu").manual_seed(63821)
          image = pipe(
              prompt=prompt,
              negative_prompt=negative,
              num_inference_steps=6,
              guidance_scale=1.5,
              width=512,
              height=640,
              generator=generator,
          ).images[0]
          image.save("generated-manager-test/manager-test.png")
          PY

      - name: Upload generated portrait
        uses: actions/upload-artifact@v4
        with:
          name: manager-art-test-dreamshaper
          path: generated-manager-test/manager-test.png
          if-no-files-found: error
          retention-days: 1
