name: Generate Manager Art OpenVINO Test

on:
  push:
    paths:
      - '.github/workflows/generate-manager-openvino.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install image generation stack
        run: |
          python -m pip install --upgrade pip
          pip install --quiet huggingface_hub pillow numpy openvino openvino-tokenizers openvino-genai "optimum[openvino]" diffusers "transformers==4.57.3" accelerate

      - name: Download reference-generation and inpainting models
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "OpenVINO/LCM_Dreamshaper_v7-int8-ov",
              local_dir="ov-manager-model",
          )
          snapshot_download(
              "OpenVINO/dreamshaper-8-inpainting-int8-ov",
              local_dir="ov-inpaint-model",
          )
          PY

      - name: Generate Manager from real player art reference
        run: |
          mkdir -p generated-manager-ov
          python - <<'PY'
          import numpy as np
          import openvino as ov
          import openvino_genai as ov_genai
          from PIL import Image

          reference = Image.open("img/avatar/avatar1.webp").convert("RGB")
          reference = reference.resize((512, 640), Image.Resampling.LANCZOS)
          reference_np = np.asarray(reference, dtype=np.uint8)[None, ...]
          reference_tensor = ov.Tensor(reference_np)

          pipe = ov_genai.Image2ImagePipeline("ov-manager-model", "CPU")
          prompt = (
              "masterpiece, best quality, RAW photorealistic cinematic sports portrait, "
              "professional association football HEAD COACH on the touchline, coach not player, one person only, "
              "mature 45-year-old man with a completely different face, short dark textured hair and trimmed beard, "
              "serious confident expression looking off camera, "
              "dark professional football coach clothing, "
              "preserve the reference composition: vertical 4:5, chest-and-torso framing, slightly low camera angle, three-quarter pose, "
              "preserve the reference night football stadium, huge bright floodlights behind the subject, shallow depth of field, "
              "preserve dramatic rim light and cinematic high contrast, subtle green and golden particles, "
              "realistic mature skin texture, premium football manager career game artwork"
          )

          tensor = pipe.generate(
              prompt,
              image=reference_tensor,
              num_images_per_prompt=1,
              width=512,
              height=640,
              num_inference_steps=4,
              guidance_scale=8.0,
              strength=0.72,
              rng_seed=59127,
          )
          image = Image.fromarray(tensor.data[0])
          image.save("generated-manager-ov/manager-base.png")
          PY

      - name: Inpaint coach clothing only
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from optimum.intel import OVStableDiffusionInpaintPipeline

          image = Image.open("generated-manager-ov/manager-base.png").convert("RGB")
          mask = Image.new("L", image.size, 0)
          draw = ImageDraw.Draw(mask)
          draw.rectangle((0, 245, image.width, image.height), fill=255)
          mask = mask.filter(ImageFilter.GaussianBlur(radius=7))

          pipe = OVStableDiffusionInpaintPipeline.from_pretrained(
              "ov-inpaint-model",
              compile=True,
          )

          prompt = (
              "photorealistic professional football head coach clothing, elegant plain BLACK tailored blazer, "
              "black fine-knit turtleneck underneath, premium realistic fabric, subtle folds, sideline manager style, "
              "completely unbranded clothing, no writing anywhere, preserve the same stadium lighting and body pose"
          )
          negative = (
              "text, letters, logo, brand, badge, crest, sponsor, emblem, jersey, football shirt, soccer kit, team uniform, "
              "tracksuit stripes, player uniform, armor, tools, safety vest, tie, distorted clothing, extra arms"
          )

          result = pipe(
              prompt=prompt,
              negative_prompt=negative,
              image=image,
              mask_image=mask,
              width=512,
              height=640,
              num_inference_steps=20,
              guidance_scale=7.5,
          ).images[0]
          result.save("generated-manager-ov/manager-test.png")
          mask.save("generated-manager-ov/manager-mask.png")
          PY

      - name: Upload generated portrait
        uses: actions/upload-artifact@v4
        with:
          name: manager-art-test-two-pass
          path: |
            generated-manager-ov/manager-base.png
            generated-manager-ov/manager-test.png
            generated-manager-ov/manager-mask.png
          if-no-files-found: error
          retention-days: 1
