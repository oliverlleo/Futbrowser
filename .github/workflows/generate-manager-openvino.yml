name: Generate Manager Art OpenVINO Test

on:
  push:
    paths:
      - '.github/workflows/generate-manager-openvino.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenVINO image stack
        run: |
          python -m pip install --upgrade pip
          pip install --quiet huggingface_hub pillow openvino openvino-tokenizers openvino-genai

      - name: Download optimized LCM DreamShaper
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "OpenVINO/LCM_Dreamshaper_v7-int8-ov",
              local_dir="ov-manager-model",
          )
          PY

      - name: Generate controlled football manager portrait
        run: |
          mkdir -p generated-manager-ov
          python - <<'PY'
          import openvino_genai as ov_genai
          from PIL import Image

          pipe = ov_genai.Text2ImagePipeline("ov-manager-model", "CPU")

          prompt = (
              "masterpiece, best quality, RAW photorealistic professional sports portrait, "
              "ONE SINGLE fictional professional ASSOCIATION FOOTBALL HEAD COACH, COACH NOT PLAYER, one person only, "
              "alone on the touchline during a night football match in a huge stadium, "
              "medium close-up waist-up portrait, head fully visible with space above hair, both shoulders visible, "
              "slightly low camera angle, three-quarter view looking right, calm determined expression, "
              "42-year-old mature man, short dark textured hair, trimmed beard, distinctive realistic face, "
              "wearing a completely PLAIN UNBRANDED BLACK COACHING JACKET over a plain black knit shirt, "
              "NO LOGO, NO BRAND, NO BADGE, NO CREST, NO TEXT, NO JERSEY, NO TEAM KIT, "
              "bright white football stadium floodlights clearly visible behind him, dark blue night sky, "
              "blurred grandstands and distant spectators, dramatic white rim light around hair and shoulders, "
              "shallow depth of field, subtle green and golden airborne particles, realistic skin pores, realistic fabric texture, "
              "cinematic high contrast color grading, 85mm lens, film grain, premium football manager career game artwork"
          )

          tensor = pipe.generate(
              prompt,
              num_images_per_prompt=1,
              width=512,
              height=640,
              num_inference_steps=4,
              guidance_scale=8.0,
              rng_seed=41427,
          )
          image = Image.fromarray(tensor.data[0])
          image.save("generated-manager-ov/manager-test.png")
          PY

      - name: Upload generated portrait
        uses: actions/upload-artifact@v4
        with:
          name: manager-art-test-openvino
          path: generated-manager-ov/manager-test.png
          if-no-files-found: error
          retention-days: 1
