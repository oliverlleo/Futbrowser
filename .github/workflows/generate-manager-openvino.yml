name: Test Full-Subject Manager Inpainting

on:
  push:
    paths:
      - '.github/workflows/generate-manager-openvino.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install inpainting stack
        run: |
          python -m pip install --upgrade pip
          pip install --quiet huggingface_hub pillow "optimum[openvino]" diffusers "transformers==4.57.3" accelerate

      - name: Download DreamShaper inpainting model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("OpenVINO/dreamshaper-8-inpainting-int8-ov", local_dir="ov-inpaint-model")
          PY

      - name: Regenerate a completely new football Manager inside the reference composition
        run: |
          mkdir -p generated-manager-test
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from optimum.intel import OVStableDiffusionInpaintPipeline

          image = Image.open("img/avatar/avatar1.webp").convert("RGB").resize((512, 640), Image.Resampling.LANCZOS)

          mask = Image.new("L", image.size, 0)
          draw = ImageDraw.Draw(mask)
          # Replace the complete person, while retaining the stadium/lights around him.
          draw.ellipse((145, 40, 375, 335), fill=255)
          draw.rectangle((0, 245, 512, 640), fill=255)
          mask = mask.filter(ImageFilter.GaussianBlur(radius=8))

          pipe = OVStableDiffusionInpaintPipeline.from_pretrained("ov-inpaint-model", compile=True)
          prompt = (
              "RAW photorealistic cinematic portrait of ONE SINGLE professional association football HEAD COACH, not a player, "
              "a 46-year-old Black man with dark brown skin, clearly African-descended facial features, "
              "short tightly curled black hair, short neat beard, mature strong angular face, calm serious expression, "
              "three-quarter view looking to the right, slightly low camera angle, chest and torso framing, "
              "wearing an elegant completely plain black tailored blazer over a black fine-knit turtleneck, "
              "professional sideline manager clothing, no team uniform, "
              "night association-football stadium, giant white floodlights behind him, blurred packed grandstands, "
              "dramatic white rim light, deep cinematic contrast, realistic skin pores, realistic fabric, subtle green and golden particles, "
              "premium football manager career video game artwork, unbranded clothing, absolutely no writing"
          )
          negative = (
              "white man, pale skin, same face as source, teenager, football player, soccer player, jersey, kit, sports shirt, "
              "text, letters, logo, brand, badge, crest, sponsor, emblem, watermark, tie, "
              "multiple people, collage, grid, maintenance worker, mechanic, tools, safety vest, hard hat, "
              "cartoon, anime, painting, low resolution, distorted face, bad anatomy, extra arms"
          )

          result = pipe(
              prompt=prompt,
              negative_prompt=negative,
              image=image,
              mask_image=mask,
              width=512,
              height=640,
              num_inference_steps=12,
              guidance_scale=8.0,
          ).images[0]
          result.save("generated-manager-test/manager-test.webp", "WEBP", quality=95, method=6)
          mask.save("generated-manager-test/mask.png")
          PY

      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: manager-full-subject-test
          path: generated-manager-test/*
          retention-days: 1
