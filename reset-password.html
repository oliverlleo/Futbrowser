<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futbrowser | Redefinir senha</title>
  <link rel="stylesheet" href="src/styles/global.css" />
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:var(--bg-app,#f4f7f9);padding:1rem}.reset-card{width:min(100%,440px);background:var(--card-solid,#fff);border:1px solid var(--line,#dfe7ec);border-radius:16px;padding:2rem;box-shadow:0 12px 32px rgba(17,34,51,.08)}.reset-card h1{margin-top:0}.reset-card p{color:var(--muted,#6f7d8d);line-height:1.5}.reset-card label{display:grid;gap:.4rem;margin:1rem 0;font-weight:700}.reset-card input{padding:.8rem;border:1px solid var(--line,#dfe7ec);border-radius:8px;background:transparent;color:var(--text,#142033)}.reset-card button{width:100%;padding:.85rem;border:0;border-radius:8px;background:var(--green,#38c91f);color:#fff;font-weight:900;cursor:pointer}.reset-card button:disabled{opacity:.6;cursor:wait}.reset-message{margin-top:1rem;color:var(--muted,#6f7d8d)}.reset-message.error{color:#d94747}.reset-message.success{color:#278b18}
  </style>
</head>
<body>
  <main class="reset-card">
    <p class="eyebrow">Futbrowser</p>
    <h1>Redefinir senha</h1>
    <p>Escolha uma nova senha para continuar sua carreira.</p>
    <form id="resetForm">
      <label>Nova senha<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
      <label>Confirmar senha<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
      <button type="submit" id="resetButton">Salvar nova senha</button>
    </form>
    <p id="resetMessage" class="reset-message" role="status"></p>
  </main>
  <script type="module" src="src/pages/login/reset-password.js"></script>
</body>
</html>
