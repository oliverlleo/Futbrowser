<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futbrowser | Redefinir senha</title>
  <link rel="stylesheet" href="src/styles/global.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .reset-card { width: min(100%, 460px); padding: 2rem; background: var(--card, #fff); border: 1px solid var(--line, #d7dee8); border-radius: 16px; box-shadow: var(--shadow, 0 18px 50px rgba(0,0,0,.12)); }
    .reset-card h1 { margin: 0 0 .5rem; color: var(--text); }
    .reset-card p { color: var(--muted); line-height: 1.5; }
    .reset-card label { display: block; margin-top: 1rem; color: var(--text); font-weight: 700; }
    .reset-card input { width: 100%; margin-top: .4rem; padding: .8rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-app, #fff); color: var(--text); }
    .reset-card button { width: 100%; margin-top: 1.25rem; padding: .85rem 1rem; border: 0; border-radius: 8px; background: var(--green, #38c91f); color: #fff; font-weight: 800; cursor: pointer; }
    .reset-card button:disabled { opacity: .6; cursor: wait; }
    .reset-message { min-height: 1.5rem; margin-top: 1rem; font-weight: 700; }
    .reset-message.error { color: var(--danger, #c0392b); }
    .reset-message.success { color: var(--green, #2a9d1c); }
  </style>
</head>
<body>
  <main class="reset-card" aria-labelledby="resetTitle">
    <h1 id="resetTitle">Redefinir senha</h1>
    <p>Escolha uma nova senha para continuar sua carreira no Futbrowser.</p>
    <form id="resetPasswordForm" novalidate>
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required />
      <label for="confirmPassword">Confirmar nova senha</label>
      <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
      <button id="resetSubmit" type="submit">Atualizar senha</button>
      <p id="resetMessage" class="reset-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
    import { supabase } from './src/services/supabase-client.js';

    const form = document.getElementById('resetPasswordForm');
    const submitButton = document.getElementById('resetSubmit');
    const message = document.getElementById('resetMessage');

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = `reset-message ${type}`.trim();
    }

    let recoverySession = null;

    async function loadRecoverySession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      recoverySession = data.session;
      if (!recoverySession) {
        showMessage('O link de recuperação expirou ou já foi utilizado.', 'error');
        submitButton.disabled = true;
      }
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        recoverySession = session;
        submitButton.disabled = false;
        showMessage('Defina sua nova senha.', 'success');
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (!recoverySession) {
        showMessage('O link de recuperação não está mais válido.', 'error');
        return;
      }
      if (password.length < 8) {
        showMessage('A senha precisa ter pelo menos 8 caracteres.', 'error');
        return;
      }
      if (password !== confirmation) {
        showMessage('As senhas não conferem.', 'error');
        return;
      }

      submitButton.disabled = true;
      showMessage('Atualizando senha...');
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        showMessage('Senha atualizada. Redirecionando para o login...', 'success');
        setTimeout(() => window.location.replace('index.html'), 900);
      } catch (error) {
        console.error('Erro ao atualizar senha:', error);
        showMessage('Não foi possível atualizar a senha. Solicite um novo link.', 'error');
        submitButton.disabled = false;
      }
    });

    loadRecoverySession().catch(error => {
      console.error('Erro ao carregar sessão de recuperação:', error);
      showMessage('Não foi possível validar o link de recuperação.', 'error');
      submitButton.disabled = true;
    });
  </script>
</body>
</html>
